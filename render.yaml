services:
  - type: web
    name: erp
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "False"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: FIRST_ADMIN_PASSWORD
        generateValue: true
      - key: FIRST_ADMIN_USERNAME
        value: admin
      - key: FIRST_ADMIN_FULL_NAME
        value: مدير النظام
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: erp-db
    plan: basic-256mb
    databaseName: erp
    user: erp_user

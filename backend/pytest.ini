[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = app/tests
# Run across cores by default. The suite was taking fourteen minutes, which is long
# enough that it stops being run after every change — and a suite you skip is worth
# less than a smaller one you don't. Each worker is its own process with its own
# in-memory SQLite database, so they cannot see each other's rows.
addopts = -n auto
